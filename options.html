<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Inställningar — Bostadssök Companion</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 18px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
    p.hint { font-size: 12px; color: #666; margin: 4px 0 0; }
    button { margin-top: 20px; padding: 9px 18px; border: none; border-radius: 6px; background: #14532d; color: white; font-size: 13px; cursor: pointer; }
    #saved { font-size: 12px; color: #2a8f4f; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Antaganden för månadskostnad</h1>
  <p class="hint">Dessa används för att räkna ut den verkliga månadskostnaden på varje annons — inte bara avgiften som Hemnet/Booli visar.</p>

  <label for="interestPct">Ränta (%)</label>
  <input type="number" id="interestPct" step="0.1" min="0" max="15" />

  <label for="amortizationPct">Amortering (%)</label>
  <input type="number" id="amortizationPct" step="0.1" min="0" max="10" />
  <p class="hint">Enligt amorteringskravet: minst 1% om belåningsgrad 50–70%, minst 2% om över 70%.</p>

  <label for="downPaymentPct">Kontantinsats (%)</label>
  <input type="number" id="downPaymentPct" step="1" min="0" max="100" />
  <p class="hint">Standard i Sverige är minst 15%.</p>

  <div>
    <button id="saveBtn">Spara</button>
    <span id="saved"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
